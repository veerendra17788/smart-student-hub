<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central Hub Symbol -->
  <circle cx="8" cy="8" r="3" fill="url(#faviconGradient)"/>
  <circle cx="8" cy="8" r="2" fill="white" opacity="0.9"/>
  
  <!-- Student Nodes -->
  <g opacity="0.9">
    <!-- Top Node -->
    <circle cx="8" cy="2" r="1.2" fill="url(#accentGradient)"/>
    <line x1="8" y1="3.2" x2="8" y2="5" stroke="url(#faviconGradient)" stroke-width="0.8" stroke-linecap="round"/>
    
    <!-- Right Node -->
    <circle cx="14" cy="8" r="1.2" fill="url(#accentGradient)"/>
    <line x1="12.8" y1="8" x2="11" y2="8" stroke="url(#faviconGradient)" stroke-width="0.8" stroke-linecap="round"/>
    
    <!-- Bottom Node -->
    <circle cx="8" cy="14" r="1.2" fill="url(#accentGradient)"/>
    <line x1="8" y1="12.8" x2="8" y2="11" stroke="url(#faviconGradient)" stroke-width="0.8" stroke-linecap="round"/>
    
    <!-- Left Node -->
    <circle cx="2" cy="8" r="1.2" fill="url(#accentGradient)"/>
    <line x1="3.2" y1="8" x2="5" y2="8" stroke="url(#faviconGradient)" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Central S Symbol -->
  <text x="8" y="10" font-family="Inter, sans-serif" font-size="4" font-weight="700" text-anchor="middle" fill="url(#faviconGradient)">S</text>
</svg>
