<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" fill="none">
  <defs>
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Logo Icon -->
  <g transform="translate(5, 5)">
    <!-- Background Circle -->
    <circle cx="20" cy="20" r="18" fill="url(#modernGradient)" opacity="0.1" stroke="url(#modernGradient)" stroke-width="0.5"/>
    
    <!-- Central Hub Symbol -->
    <circle cx="20" cy="20" r="6" fill="url(#modernGradient)" filter="url(#glow)"/>
    <circle cx="20" cy="20" r="4" fill="white" opacity="0.9"/>
    
    <!-- Student Nodes -->
    <g opacity="0.9">
      <!-- Top Node -->
      <circle cx="20" cy="6" r="2.5" fill="url(#accentGradient)"/>
      <line x1="20" y1="8.5" x2="20" y2="16" stroke="url(#modernGradient)" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Right Node -->
      <circle cx="34" cy="20" r="2.5" fill="url(#accentGradient)"/>
      <line x1="31.5" y1="20" x2="24" y2="20" stroke="url(#modernGradient)" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Bottom Node -->
      <circle cx="20" cy="34" r="2.5" fill="url(#accentGradient)"/>
      <line x1="20" y1="31.5" x2="20" y2="24" stroke="url(#modernGradient)" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Left Node -->
      <circle cx="6" cy="20" r="2.5" fill="url(#accentGradient)"/>
      <line x1="8.5" y1="20" x2="16" y2="20" stroke="url(#modernGradient)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Innovation Sparks -->
    <g opacity="0.6">
      <path d="M28 12 L30 10 L32 12 L30 14 Z" fill="#F59E0B"/>
      <path d="M32 28 L34 26 L36 28 L34 30 Z" fill="#EF4444"/>
      <path d="M8 28 L10 26 L12 28 L10 30 Z" fill="#10B981"/>
      <path d="M12 8 L14 6 L16 8 L14 10 Z" fill="#8B5CF6"/>
    </g>
    
    <!-- Central S Symbol -->
    <text x="20" y="25" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="url(#modernGradient)">S</text>
  </g>
  
  <!-- Text -->
  <g transform="translate(55, 10)">
    <text x="0" y="16" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="url(#textGradient)">Smart Student Hub</text>
    <text x="0" y="32" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#64748B" opacity="0.8">Empowering Academic Excellence Through Innovation</text>
    
    <!-- Modern Decorative Elements -->
    <g opacity="0.4">
      <rect x="220" y="8" width="2" height="8" rx="1" fill="url(#modernGradient)"/>
      <rect x="225" y="12" width="2" height="4" rx="1" fill="url(#accentGradient)"/>
      <rect x="230" y="6" width="2" height="12" rx="1" fill="url(#modernGradient)"/>
      <circle cx="240" cy="12" r="2" fill="#F59E0B" opacity="0.6"/>
      <circle cx="248" cy="16" r="1.5" fill="#10B981" opacity="0.6"/>
    </g>
  </g>
</svg>
